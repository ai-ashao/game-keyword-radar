[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "game-keyword-radar"
version = "2.0.0rc1"
description = "Local-first cross-platform Game Demand Radar and keyword/page research workbench."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12,<5", "fastapi>=0.115,<1", "httpx>=0.27,<1",
  "jinja2>=3.1,<4", "pydantic>=2.8,<3", "typer>=0.12,<1", "uvicorn>=0.30,<1",
]
[project.optional-dependencies]
trends = ["pytrends-modern>=0.2,<0.3"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=5,<7"]
[project.scripts]
game-radar = "game_keyword_radar.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/game_keyword_radar"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires network and configured personal API credentials (not part of default suite)"]
[tool.coverage.run]
source = ["game_keyword_radar"]
branch = true
